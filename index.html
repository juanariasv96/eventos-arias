<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eventos Arias · Sistema Administrativo</title>
<link rel="apple-touch-icon" href="https://images.weserv.nl/?url=www.eventosarias.com/wp-content/uploads/2024/06/logonuevo.jpg&w=360&h=360&fit=cover&a=center">
<link rel="icon" type="image/jpeg" href="https://images.weserv.nl/?url=www.eventosarias.com/wp-content/uploads/2024/06/logonuevo.jpg&w=360&h=360&fit=cover&a=center">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Eventos Arias">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#002E5B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===================== SISTEMA DE DISEÑO · COLORES INSTITUCIONALES EVENTOS ARIAS ===================== */
:root{
  --navy:#002E5B;         /* azul marino primario (header/footer del sitio) */
  --navy-2:#1C315A;       /* azul secundario (botones) */
  --blue:#0095D6;         /* azul acento brillante */
  --blue-light:#6C98E1;   /* azul claro del logo */
  --navy-900:#001C38;
  --ink:#243244;
  --muted:#667085;
  --line:#E4E8EF;
  --bg:#F4F7FB;
  --surface:#FFFFFF;
  --white:#FFFFFF;
  --ok:#1E9E63;      --ok-bg:#E7F6EE;
  --warn:#C77700;    --warn-bg:#FDF3E2;
  --info:#0095D6;    --info-bg:#E3F3FC;
  --pay:#1E9E63;     --pay-bg:#E7F6EE;
  --danger:#D64545;  --danger-bg:#FBE9E9;
  --radius:14px; --radius-sm:10px;
  --shadow:0 1px 3px rgba(16,40,80,.06),0 8px 24px rgba(16,40,80,.06);
  --shadow-lg:0 12px 40px rgba(0,46,91,.18);
  --sans:'Open Sans',system-ui,Arial,sans-serif;
  --head:'Poppins',var(--sans);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,.brand{font-family:var(--head)}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:14px}
a{color:var(--blue);text-decoration:none}
.hidden{display:none!important}

/* ===================== LOGIN ===================== */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--navy-900),var(--navy) 55%,var(--navy-2));padding:20px;z-index:100}
.login-card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow-lg);width:100%;max-width:400px;padding:38px 34px;text-align:center}
.login-logo{width:78px;height:78px;border-radius:50%;background:var(--navy);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;box-shadow:0 6px 18px rgba(0,46,91,.3)}
.login-logo span{font-family:var(--head);font-weight:700;color:#fff;font-size:26px;letter-spacing:1px}
.login-card h1{font-size:21px;color:var(--navy);margin-bottom:2px}
.login-card .sub{color:var(--muted);font-size:13px;margin-bottom:24px}
.field{text-align:left;margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--navy-2);margin-bottom:6px}
.field input{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:var(--radius-sm);transition:.15s}
.field input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,149,214,.12)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:var(--radius-sm);font-weight:600;font-size:14px;transition:.15s;white-space:nowrap}
.btn-primary{background:var(--navy);color:#fff;width:100%}
.btn-primary:hover{background:var(--navy-2)}
.btn-accent{background:var(--blue);color:#fff}
.btn-accent:hover{filter:brightness(.94)}
.btn-ghost{background:var(--bg);color:var(--navy-2)}
.btn-ghost:hover{background:#e9eef6}
.btn-sm{padding:7px 12px;font-size:13px}
.login-demo{margin-top:14px;font-size:13px;color:var(--muted)}
.login-demo button{color:var(--blue);font-weight:600}
.login-err{color:var(--danger);font-size:13px;margin-top:10px;min-height:18px}

/* ===================== LAYOUT ===================== */
#app{display:flex;min-height:100vh}
.sidebar{width:242px;background:var(--navy);color:#cfe0f2;display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:40;transition:transform .25s}
.side-brand{display:flex;align-items:center;gap:11px;padding:20px 20px 16px}
.side-brand .mark{width:40px;height:40px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.side-brand .mark span{color:var(--navy);font-family:var(--head);font-weight:700;font-size:16px}
.side-brand b{color:#fff;font-family:var(--head);font-size:15px;line-height:1.1;display:block}
.side-brand small{color:var(--blue-light);font-size:11px;letter-spacing:.5px}
.nav{padding:8px 12px;flex:1;overflow-y:auto}
.nav-label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#6f8fb5;padding:14px 12px 6px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 13px;border-radius:var(--radius-sm);color:#cfe0f2;font-weight:500;font-size:13.5px;margin-bottom:2px;transition:.15s}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a.active{background:var(--blue);color:#fff;box-shadow:0 4px 12px rgba(0,149,214,.35)}
.nav a svg{width:19px;height:19px;flex-shrink:0}
.side-foot{padding:14px;border-top:1px solid rgba(255,255,255,.1)}
.side-user{display:flex;align-items:center;gap:10px;font-size:13px}
.side-user .av{width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.side-user b{color:#fff;display:block;font-size:13px}
.side-user small{color:#8fb0d6;font-size:11px}
.side-foot .btn{width:100%;margin-top:12px;background:rgba(255,255,255,.08);color:#cfe0f2}
.side-foot .btn:hover{background:rgba(255,255,255,.16)}

.main{flex:1;margin-left:242px;min-width:0;display:flex;flex-direction:column}
.topbar{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 26px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:30}
.topbar .menu-btn{display:none;color:var(--navy)}
.topbar h2{font-size:19px;color:var(--navy);flex:1}
.topbar .demo-badge{background:var(--warn-bg);color:var(--warn);font-size:11px;font-weight:700;padding:5px 10px;border-radius:20px;letter-spacing:.3px}
.content{padding:26px;max-width:1300px;width:100%;margin:0 auto}
.page{display:none}
.page.active{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ===================== COMPONENTES ===================== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.section-head{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.section-head h3{font-size:16px;color:var(--navy);flex:1}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:22px}
.kpi{padding:18px 20px;position:relative;overflow:hidden}
.kpi .ic{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.kpi .ic svg{width:22px;height:22px}
.kpi .val{font-family:var(--head);font-size:26px;font-weight:700;color:var(--navy);line-height:1}
.kpi .lbl{color:var(--muted);font-size:12.5px;margin-top:5px}
.i-navy{background:rgba(0,46,91,.1);color:var(--navy)}
.i-blue{background:var(--info-bg);color:var(--blue)}
.i-warn{background:var(--warn-bg);color:var(--warn)}
.i-ok{background:var(--ok-bg);color:var(--ok)}

table{width:100%;border-collapse:collapse}
thead th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody td{padding:13px 14px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#f8fafd}
.t-wrap{overflow-x:auto}

.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-pendiente{background:var(--warn-bg);color:var(--warn)}
.b-confirmado{background:var(--info-bg);color:var(--info)}
.b-anticipo{background:#EEE9FB;color:#6B4EBB}
.b-pagado{background:var(--pay-bg);color:var(--pay)}
.b-cancelado{background:var(--danger-bg);color:var(--danger)}
.pill{display:inline-block;padding:3px 9px;border-radius:6px;font-size:11.5px;font-weight:600;background:var(--bg);color:var(--navy-2)}
.seg{--bg2:#eef2f7}
.seg-b{border:0;background:transparent;padding:8px 16px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:.15s}
.seg-b .pill{background:rgba(0,0,0,.06)}
.seg-b.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg-b.on .pill{background:var(--accent);color:#fff}

.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.search{position:relative;flex:1;min-width:180px;max-width:320px}
.search input{width:100%;padding:9px 12px 9px 34px;border:1.5px solid var(--line);border-radius:var(--radius-sm);background:#fff}
.search input:focus{outline:none;border-color:var(--blue)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
select.filter{padding:9px 12px;border:1.5px solid var(--line);border-radius:var(--radius-sm);background:#fff;color:var(--ink)}
select.filter:focus{outline:none;border-color:var(--blue)}

/* PIPELINE / KANBAN */
.pipeline{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:14px;overflow-x:auto;padding-bottom:6px}
.col{background:#eef2f8;border-radius:var(--radius);padding:12px;min-width:220px}
.col-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:2px 4px}
.col-head b{font-size:13px;color:var(--navy)}
.col-head .cnt{background:#fff;color:var(--muted);font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px}
.col-top{height:3px;border-radius:3px;margin-bottom:10px}
.ev-card{background:#fff;border-radius:10px;padding:12px;box-shadow:0 1px 2px rgba(16,40,80,.06);margin-bottom:10px;cursor:pointer;border-left:3px solid var(--line);transition:.15s}
.ev-card:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.ev-card .cli{font-weight:700;color:var(--navy);font-size:13.5px}
.ev-card .meta{color:var(--muted);font-size:12px;margin-top:4px;display:flex;align-items:center;gap:6px}
.ev-card .amt{margin-top:8px;font-size:12.5px;display:flex;justify-content:space-between}
.ev-card .amt b{color:var(--navy)}

/* CALENDARIO */
.cal-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.cal-head h3{flex:1;font-size:17px;color:var(--navy);text-transform:capitalize}
.cal-nav{display:flex;gap:6px}
.cal-nav button{width:34px;height:34px;border-radius:9px;background:var(--bg);color:var(--navy);display:flex;align-items:center;justify-content:center}
.cal-nav button:hover{background:#e5ebf4}
.calendar{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-dow{background:#f6f8fc;padding:9px;text-align:center;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--line)}
.cal-cell{min-height:96px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;position:relative}
.cal-cell:nth-child(7n){border-right:none}
.cal-cell.out{background:#fafbfd}
.cal-cell .dn{font-size:12px;font-weight:600;color:var(--ink);width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:6px}
.cal-cell.today .dn{background:var(--blue);color:#fff}
.cal-cell.out .dn{color:#b6c0cf}
.cal-ev{margin-top:4px;font-size:11px;padding:3px 6px;border-radius:5px;color:#fff;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.ce-pendiente{background:var(--warn)}
.ce-confirmado{background:var(--info)}
.ce-anticipo{background:#6B4EBB}
.ce-pagado{background:var(--pay)}
.ce-cancelado{background:var(--danger)}
.cal-more{font-size:10.5px;color:var(--muted);margin-top:2px;padding-left:4px}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,28,56,.5);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;padding:18px;z-index:80}
.modal{background:#fff;border-radius:16px;box-shadow:var(--shadow-lg);width:100%;max-width:620px;max-height:92vh;overflow:hidden;display:flex;flex-direction:column;animation:pop .2s}
.modal-lg{max-width:820px}
.chk{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--ink);margin:4px 0 6px;cursor:pointer}
.chk input{width:17px;height:17px}
.cot-item{display:grid;grid-template-columns:1fr 68px 100px 92px 34px;gap:8px;align-items:center;margin-bottom:8px}
.cot-item .ci-imp{font-weight:600;font-size:13px;text-align:right;color:var(--navy)}
.cot-item .rm{width:34px;height:38px;border-radius:8px;background:var(--danger-bg);color:var(--danger);display:flex;align-items:center;justify-content:center;border:0;cursor:pointer}
@media(max-width:640px){.cot-item{grid-template-columns:1fr 56px 84px 30px}.cot-item .ci-imp{display:none}}
.cot-tot{background:var(--bg);border-radius:10px;padding:12px 16px;margin:6px 0 4px}
.cot-tot .row{display:flex;justify-content:space-between;font-size:13.5px;padding:3px 0;color:var(--muted)}
.cot-tot .row b{color:var(--ink)}
.cot-tot .row.total{border-top:1.5px solid var(--line);margin-top:6px;padding-top:8px;font-size:16px}
.cot-tot .row.total span,.cot-tot .row.total b{color:var(--navy);font-weight:700}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.modal.wide{max-width:760px}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.modal-head h3{flex:1;color:var(--navy);font-size:17px}
.modal-head .x{width:32px;height:32px;border-radius:8px;color:var(--muted);display:flex;align-items:center;justify-content:center}
.modal-head .x:hover{background:var(--bg)}
.modal-body{padding:20px 22px;overflow-y:auto}
.modal-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;background:#fbfcfe}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.form-field{margin-bottom:14px}
.form-field label{display:block;font-size:12px;font-weight:600;color:var(--navy-2);margin-bottom:6px}
.form-field input,.form-field select,.form-field textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:var(--radius-sm);background:#fff}
.form-field input:focus,.form-field select:focus,.form-field textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,149,214,.1)}
.form-field textarea{resize:vertical;min-height:64px}
.hint{font-size:11.5px;color:var(--muted);margin-top:4px}
.item-row{display:grid;grid-template-columns:1fr 90px 34px;gap:8px;align-items:center;margin-bottom:8px}
.item-row .rm{width:34px;height:38px;border-radius:8px;background:var(--danger-bg);color:var(--danger);display:flex;align-items:center;justify-content:center}
.summary{background:var(--bg);border-radius:10px;padding:14px 16px;margin-top:6px}
.summary .r{display:flex;justify-content:space-between;padding:4px 0;font-size:13.5px}
.summary .r.tot{border-top:1px dashed var(--line);margin-top:6px;padding-top:10px;font-weight:700;color:var(--navy);font-size:15px}
.summary .r .saldo{color:var(--warn);font-weight:700}

.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty svg{width:54px;height:54px;color:#c7d2e0;margin-bottom:12px}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

/* CHOFER agenda */
.driver-day{margin-bottom:22px}
.driver-day .dh{font-family:var(--head);font-weight:700;color:var(--navy);font-size:14px;margin-bottom:10px;text-transform:capitalize;display:flex;align-items:center;gap:8px}
.job{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:12px;box-shadow:var(--shadow)}
.job .jt{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.job .jt b{color:var(--navy);font-size:15px}
.job .addr{color:var(--ink);font-size:13px;margin-top:6px;display:flex;gap:7px;align-items:flex-start}
.job .addr svg{width:15px;height:15px;color:var(--blue);flex-shrink:0;margin-top:2px}
.job .load{margin-top:10px;background:var(--bg);border-radius:9px;padding:10px 12px}
.job .load b{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.job .load ul{list-style:none;margin-top:6px}
.job .load li{font-size:13px;padding:2px 0;display:flex;justify-content:space-between}
.job .load li span:last-child{font-weight:700;color:var(--navy)}
.job-actions{display:flex;gap:8px;margin-top:12px}
.job-actions .btn{flex:1}
.check-done{background:var(--ok-bg);color:var(--ok);border:1.5px solid #bfe6cf}
.check-todo{background:var(--navy);color:#fff}

/* TOAST */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:12px 20px;border-radius:10px;box-shadow:var(--shadow-lg);font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:200}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{background:var(--ok)}
#toast.err{background:var(--danger)}

.stock-bar{height:6px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:5px;width:110px}
.stock-bar i{display:block;height:100%;background:var(--ok)}
.stock-bar.low i{background:var(--warn)}
.stock-bar.none i{background:var(--danger)}

/* RESPONSIVE */
.backdrop{display:none}
@media(max-width:860px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:none}
  .main{margin-left:0}
  .topbar .menu-btn{display:flex}
  .backdrop.show{display:block;position:fixed;inset:0;background:rgba(0,28,56,.4);z-index:35}
  .grid2,.grid3{grid-template-columns:1fr}
  .content{padding:16px}
}
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="login">
  <div class="login-card">
    <img src="https://www.eventosarias.com/wp-content/uploads/2024/06/logonuevo.jpg" alt="Eventos Arias" style="width:220px;max-width:84%;height:auto;border-radius:12px;display:block;margin:0 auto 18px;box-shadow:0 8px 20px rgba(0,46,91,.35)">
    <h1>Eventos Arias</h1>
    <div class="sub">Sistema Administrativo</div>
    <div class="field"><label>Correo</label><input type="email" id="loginEmail" placeholder="tucorreo@eventosarias.com" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></div>
    <div class="field"><label>Contraseña</label><input type="password" id="loginPass" placeholder="Escribe tu contraseña" autocomplete="new-password"></div>
    <button class="btn btn-primary" id="loginBtn">Entrar</button>
    <div class="login-err" id="loginErr"></div>
    <div class="login-demo">¿Solo explorando? <button id="demoBtn">Entrar en modo demo</button></div>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="app" class="hidden">
  <div class="backdrop" id="backdrop"></div>
  <aside class="sidebar" id="sidebar">

   CAPA DE DATOS (Store) — misma interfaz para demo y Supabase

const LS_KEY = 'eventos_arias_demo_v1';
const Store = {
  async init(){
    const cfg = window.SUPABASE_CONFIG||{};
    if(cfg.url && cfg.anonKey && window.supabase){
      state.mode='supabase';
      state.sb = window.supabase.createClient(cfg.url, cfg.anonKey);
      return;
    }
    state.mode='demo';
  },
  /* ----- DEMO persistence ----- */
  _saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state.data)); }catch(e){} },
  _loadLocal(){ try{ const r=localStorage.getItem(LS_KEY); return r?JSON.parse(r):null; }catch(e){ return null; } },

  async loadAll(){
    if(state.mode==='supabase'){
      const [mob,ev,ch,cl,en,co] = await Promise.all([
        state.sb.from('mobiliario').select('*').order('categoria'),
        state.sb.from('eventos').select('*, evento_items(*)').order('fecha'),
        state.sb.from('choferes').select('*').order('nombre'),
        state.sb.from('clientes').select('*').order('numero_cliente'),
        state.sb.from('encargos').select('*').order('fecha'),
        state.sb.from('cotizaciones').select('*, cotizacion_items(*)').order('folio',{ascending:false})
      ]);
      state.data.mobiliario = mob.data||[];
      state.data.choferes = ch.data||[];
      state.data.clientes = cl.data||[];
      state.data.encargos = en.data||[];
      state.data.eventos = (ev.data||[]).map(e=>({...e, items:(e.evento_items||[]).map(i=>({mob_id:i.mobiliario_id,cantidad:i.cantidad}))}));
      state.data.cotizaciones = (co.data||[]).map(c=>({...c, items:(c.cotizacion_items||[]).map(i=>({mob_id:i.mobiliario_id,descripcion:i.descripcion,cantidad:i.cantidad,precio:i.precio_unitario}))}));
      return;
    }
    const saved = this._loadLocal();
    state.data = saved || seedDemo();
    if(!state.data.clientes) state.data.clientes=[];
    if(!state.data.encargos) state.data.encargos=[];
    if(!state.data.cotizaciones) state.data.cotizaciones=[];
    this._saveLocal();
  },

  async saveEvento(ev){
    if(state.mode==='supabase'){
      const {items,...row} = ev;
      const isNew=!row.id;
      let id=row.id;
      if(isNew){ const {data}=await state.sb.from('eventos').insert(cleanEvRow(row)).select().single(); id=data.id; }
      else{ await state.sb.from('eventos').update(cleanEvRow(row)).eq('id',id); await state.sb.from('evento_items').delete().eq('evento_id',id); }
      if(items&&items.length) await state.sb.from('evento_items').insert(items.map(i=>({evento_id:id,mobiliario_id:i.mob_id,cantidad:i.cantidad})));
      await this.loadAll(); return;
    }
    const list=state.data.eventos;
    if(ev.id){ const i=list.findIndex(x=>x.id===ev.id); list[i]={...list[i],...ev}; }
    else{ ev.id=uid(); ev.created=todayISO(); list.push(ev); }
    this._saveLocal();
  },
  async deleteEvento(id){
    if(state.mode==='supabase'){ await state.sb.from('eventos').delete().eq('id',id); await this.loadAll(); return; }
    state.data.eventos = state.data.eventos.filter(e=>e.id!==id); this._saveLocal();
  },
  async patchEvento(id,patch){
    if(state.mode==='supabase'){ await state.sb.from('eventos').update(patch).eq('id',id); await this.loadAll(); return; }
    const e=state.data.eventos.find(x=>x.id===id); if(e)Object.assign(e,patch); this._saveLocal();
  },
  async saveMob(m){
    if(state.mode==='supabase'){
      if(m.id) await state.sb.from('mobiliario').update(m).eq('id',m.id);
      else await state.sb.from('mobiliario').insert(m);
      await this.loadAll(); return;
    }
    const list=state.data.mobiliario;
    if(m.id){ const i=list.findIndex(x=>x.id===m.id); list[i]={...list[i],...m}; }
    else{ m.id=uid(); list.push(m); }
    this._saveLocal();
  },
  async deleteMob(id){
    if(state.mode==='supabase'){ await state.sb.from('mobiliario').delete().eq('id',id); await this.loadAll(); return; }
    state.data.mobiliario = state.data.mobiliario.filter(m=>m.id!==id); this._saveLocal();
  },
  async saveCliente(c){
    if(state.mode==='supabase'){
      if(c.id) await state.sb.from('clientes').update({nombre:c.nombre,telefono:c.telefono,email:c.email,direccion:c.direccion,notas:c.notas}).eq('id',c.id);
      else await state.sb.from('clientes').insert({nombre:c.nombre,telefono:c.telefono,email:c.email,direccion:c.direccion,notas:c.notas});
      await this.loadAll(); return;
    }
    const list=state.data.clientes;
    if(c.id){ const i=list.findIndex(x=>x.id===c.id); list[i]={...list[i],...c}; }
    else{ c.id=uid(); c.numero_cliente=(list.reduce((m,x)=>Math.max(m,x.numero_cliente||0),0))+1; list.push(c); }
    this._saveLocal();
  },
  async deleteCliente(id){
    if(state.mode==='supabase'){ await state.sb.from('clientes').delete().eq('id',id); await this.loadAll(); return; }
    state.data.clientes = state.data.clientes.filter(c=>c.id!==id); this._saveLocal();
  },
  async saveEncargo(en){
    if(state.mode==='supabase'){
      const row={titulo:en.titulo,chofer_id:en.chofer_id||null,fecha:en.fecha||null,prioridad:en.prioridad||'normal',notas:en.notas||null,estatus:en.estatus||'pendiente'};
      if(en.id) await state.sb.from('encargos').update(row).eq('id',en.id);
      else await state.sb.from('encargos').insert(row);
      await this.loadAll(); return;
    }
    const list=state.data.encargos;
    if(en.id){ const i=list.findIndex(x=>x.id===en.id); list[i]={...list[i],...en}; }
    else{ en.id=uid(); en.estatus=en.estatus||'pendiente'; en.creado_en=todayISO(); list.push(en); }
    this._saveLocal();
  },
  async deleteEncargo(id){
    if(state.mode==='supabase'){ await state.sb.from('encargos').delete().eq('id',id); await this.loadAll(); return; }
    state.data.encargos = state.data.encargos.filter(e=>e.id!==id); this._saveLocal();
  },
  async patchEncargo(id,patch){
    if(state.mode==='supabase'){ await state.sb.from('encargos').update(patch).eq('id',id); await this.loadAll(); return; }
    const e=state.data.encargos.find(x=>x.id===id); if(e)Object.assign(e,patch); this._saveLocal();
  },
  async saveCotizacion(cot){
    const t=cotTotals(cot); cot.subtotal=t.subtotal; cot.total=t.total;
    if(state.mode==='supabase'){
      const {items,...rest}=cot; const row=cleanCotRow(rest); const isNew=!row.id; let id=row.id;
      if(isNew){ const {data}=await state.sb.from('cotizaciones').insert(row).select().single(); id=data.id; }
      else{ await state.sb.from('cotizaciones').update(row).eq('id',id); await state.sb.from('cotizacion_items').delete().eq('cotizacion_id',id); }
      if(items&&items.length) await state.sb.from('cotizacion_items').insert(items.map(i=>({cotizacion_id:id,mobiliario_id:i.mob_id||null,descripcion:i.descripcion,cantidad:i.cantidad,precio_unitario:i.precio})));
      await this.loadAll(); return id;
    }
    const list=state.data.cotizaciones;
    if(cot.id){ const i=list.findIndex(x=>x.id===cot.id); list[i]={...list[i],...cot}; }
    else{ cot.id=uid(); cot.folio=(list.reduce((m,x)=>Math.max(m,x.folio||0),0))+1; cot.creado_en=todayISO(); list.unshift(cot); }
    this._saveLocal(); return cot.id;
  },
  async deleteCotizacion(id){
    if(state.mode==='supabase'){ await state.sb.from('cotizaciones').delete().eq('id',id); await this.loadAll(); return; }
    state.data.cotizaciones = state.data.cotizaciones.filter(c=>c.id!==id); this._saveLocal();
  },
  async patchCotizacion(id,patch){
    if(state.mode==='supabase'){ await state.sb.from('cotizaciones').update(patch).eq('id',id); await this.loadAll(); return; }
    const c=state.data.cotizaciones.find(x=>x.id===id); if(c)Object.assign(c,patch); this._saveLocal();
  }
};
function cleanEvRow(r){ const {items,evento_items,...rest}=r; return rest; }
function cleanCotRow(r){ const {items,cotizacion_items,...rest}=r; if(rest.folio==null) delete rest.folio; return rest; }

/* ---------- Helpers de negocio ---------- */
const mobById = (id)=>state.data.mobiliario.find(m=>m.id===id);
const choferById = (id)=>state.data.choferes.find(c=>c.id===id);
const clienteById = (id)=>state.data.clientes.find(c=>c.id===id);
const saldo = (e)=>Math.max(0,(Number(e.total)||0)-(Number(e.anticipo)||0));
const cobrado = (e)=> e.estatus==='pagado' ? (Number(e.total)||0) : (Number(e.anticipo)||0);
function disponibleEn(mobId,fecha,excludeId){
  const m=mobById(mobId); if(!m) return 0;
  let usado=0;
  state.data.eventos.forEach(e=>{
    if(e.id===excludeId||e.fecha!==fecha||e.estatus==='cancelado')return;
    (e.items||[]).forEach(it=>{ if(it.mob_id===mobId)usado+=Number(it.cantidad)||0; });
  });
  return m.cantidad_total - usado;
}
function eventoTotalCalc(items){ return (items||[]).reduce((s,it)=>{ const m=mobById(it.mob_id); return s+(m?(Number(m.precio_renta)||0)*(Number(it.cantidad)||0):0); },0); }

/* ---------- Cotizaciones: cálculos y estatus ---------- */
function cotTotals(cot){
  const subtotal=(cot.items||[]).reduce((s,it)=>s+(Number(it.precio)||0)*(Number(it.cantidad)||0),0);
  const desc=Number(cot.descuento)||0, envio=Number(cot.envio)||0;
  const base=Math.max(0,subtotal-desc);
  const iva=cot.iva?base*0.16:0;
  const total=base+iva+envio;
  return {subtotal,base,iva,envio,desc,total};
}
const COT_STATUS={
  borrador:{label:'Borrador',cls:'b-pendiente'},
  enviada:{label:'Enviada',cls:'b-confirmado'},
  aceptada:{label:'Aceptada',cls:'b-pagado'},
  rechazada:{label:'Rechazada',cls:'b-cancelado'},
  vencida:{label:'Vencida',cls:'b-cancelado'}
};
function cotVence(cot){ if(!cot.fecha) return null; const d=new Date(cot.fecha+'T12:00:00'); d.setDate(d.getDate()+(Number(cot.vigencia_dias)||15)); return d; }
function cotEstatusEf(cot){ if(cot.estatus==='enviada'){ const v=cotVence(cot); if(v && v < new Date(todayISO()+'T12:00:00')) return 'vencida'; } return cot.estatus||'borrador'; }

/* ---------- DASHBOARD ---------- */
function renderDashboard(c){
  const hoy=todayISO();
  const activos=state.data.eventos.filter(e=>e.estatus!=='cancelado');
  const proximos=activos.filter(e=>e.fecha>=hoy).sort((a,b)=>a.fecha.localeCompare(b.fecha));
  const porConfirmar=activos.filter(e=>e.estatus==='pendiente').length;
  const ym=hoy.slice(0,7);
  const ingresosMes=activos.filter(e=>e.fecha.slice(0,7)===ym).reduce((s,e)=>s+cobrado(e),0);
  const porCobrar=activos.filter(e=>e.fecha>=hoy).reduce((s,e)=>s+saldo(e),0);

  c.appendChild(el(`<div class="kpi-grid">
    ${kpi('cal','i-blue',proximos.length,'Eventos próximos')}
    ${kpi('pipe','i-warn',porConfirmar,'Por confirmar')}
    ${kpi('money','i-ok',money(ingresosMes),'Ingresos del mes')}
    ${kpi('money','i-navy',money(porCobrar),'Saldo por cobrar')}
  </div>`));

  const wrap=el(`<div class="card" style="padding:20px"><div class="section-head"><h3>Próximos eventos</h3><button class="btn btn-accent btn-sm" id="ndash">${svg('plus',16)} Nuevo evento</button></div></div>`);
  if(!proximos.length){ wrap.appendChild(emptyState('Sin eventos próximos','Programa tu primer evento.')); }
  else{
    const t=el(`<div class="t-wrap"><table><thead><tr><th>Cliente</th><th>Fecha</th><th>Hora</th><th>Tipo</th><th>Estatus</th><th style="text-align:right">Total</th><th style="text-align:right">Saldo</th></tr></thead><tbody></tbody></table></div>`);
    const tb=$('tbody',t);
    proximos.slice(0,8).forEach(e=>{
      const tr=el(`<tr style="cursor:pointer"><td><b>${esc(e.cliente)}</b></td><td>${fmtFecha(e.fecha)}</td><td>${esc(e.hora||'—')}</td><td><span class="pill">${esc(e.tipo||'—')}</span></td><td>${badge(e.estatus)}</td><td style="text-align:right;font-weight:600">${money(e.total)}</td><td style="text-align:right;color:${saldo(e)>0?'var(--warn)':'var(--ok)'};font-weight:600">${saldo(e)>0?money(saldo(e)):'Liquidado'}</td></tr>`);
      tr.onclick=()=>openEventoModal(e); tb.appendChild(tr);
    });
    wrap.appendChild(t);
  }
  c.appendChild(wrap);
  $('#ndash').onclick=()=>openEventoModal();
}

function renderCalendario(c){
  const d=state.calDate, y=d.getFullYear(), m=d.getMonth();
  const head=el(`<div class="cal-head">
    <div class="cal-nav"><button id="pm">${svg('cal',0)&&'‹'}</button><button id="nm">›</button></div>

    <button class="btn btn-accent btn-sm" id="ncal">${svg('plus',16)} Nuevo</button>
  </div>`);
  c.appendChild(head);
  $('#pm',head).onclick=()=>{state.calDate=new Date(y,m-1,1);render();};
  $('#nm',head).onclick=()=>{state.calDate=new Date(y,m+1,1);render();};
  $('#hoy',head).onclick=()=>{state.calDate=new Date();render();};
  $('#ncal',head).onclick=()=>openEventoModal();

  const first=new Date(y,m,1), start=first.getDay(), days=new Date(y,m+1,0).getDate();
  const cal=el(`<div class="calendar"><div class="cal-grid">${DOW.map(d=>`<div class="cal-dow">${d}</div>`).join('')}</div><div class="cal-grid" id="cg"></div></div>`);
  const g=$('#cg',cal);
  const prevDays=new Date(y,m,0).getDate();
  const cells=[];
  for(let i=start-1;i>=0;i--)cells.push({day:prevDays-i,out:true,iso:new Date(y,m-1,prevDays-i).toISOString().slice(0,10)});
  for(let i=1;i<=days;i++)cells.push({day:i,out:false,iso:new Date(y,m,i).toISOString().slice(0,10)});
  let nx=1; while(cells.length%7!==0||cells.length<42){ cells.push({day:nx,out:true,iso:new Date(y,m+1,nx).toISOString().slice(0,10)}); nx++; if(cells.length>=42)break; }
  const hoy=todayISO();
  cells.forEach(cell=>{
    const evs=state.data.eventos.filter(e=>e.fecha===cell.iso&&e.estatus!=='cancelado');
    const cd=el(`<div class="cal-cell ${cell.out?'out':''} ${cell.iso===hoy?'today':''}"><div class="dn">${cell.day}</div></div>`);
    evs.slice(0,3).forEach(e=>{ const ev=el(`<div class="cal-ev ce-${e.estatus}" title="${esc(e.cliente)} · ${esc(e.hora||'')}">${esc(e.hora?e.hora+' ':'')}${esc(e.cliente)}</div>`); ev.onclick=()=>openEventoModal(e); cd.appendChild(ev); });
    if(evs.length>3)cd.appendChild(el(`<div class="cal-more">+${evs.length-3} más</div>`));
    g.appendChild(cd);
  });
  c.appendChild(cal);
  c.appendChild(el(`<div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:12px;color:var(--muted)">
    ${PIPELINE_COLS.map(p=>`<span style="display:flex;align-items:center;gap:6px"><i style="width:11px;height:11px;border-radius:3px;background:${p.color};display:inline-block"></i>${STATUS[p.k].label}</span>`).join('')}
  </div>`));
}

    const sel=$('#invCat',bar); sel.innerHTML='<option value="">Todas las categorías</option>';

        <td style="text-align:right;white-space:nowrap"><button class="btn btn-ghost btn-sm ed">Editar</button></td>

/* ---------- FINANZAS ---------- */
function renderFinanzas(c){
  const activos=state.data.eventos.filter(e=>e.estatus!=='cancelado');
  const totalContratado=activos.reduce((s,e)=>s+(Number(e.total)||0),0);
  const totalCobrado=activos.reduce((s,e)=>s+cobrado(e),0);
  const totalPorCobrar=activos.reduce((s,e)=>s+saldo(e),0);
  c.appendChild(el(`<div class="kpi-grid">
    ${kpi('money','i-navy',money(totalContratado),'Total contratado')}
    ${kpi('money','i-ok',money(totalCobrado),'Cobrado')}
    ${kpi('money','i-warn',money(totalPorCobrar),'Por cobrar')}
    ${kpi('pipe','i-blue',activos.length,'Eventos activos')}
  </div>`));

  // Ingresos por mes (últimos 6 meses con datos)
  const byMonth={};
  activos.forEach(e=>{ const k=e.fecha.slice(0,7); byMonth[k]=(byMonth[k]||0)+cobrado(e); });
  const months=Object.keys(byMonth).sort().slice(-6);
  const max=Math.max(1,...months.map(m=>byMonth[m]));
  const chart=el(`<div class="card" style="padding:20px;margin-bottom:22px"><div class="section-head"><h3>Ingresos cobrados por mes</h3></div><div style="display:flex;align-items:flex-end;gap:14px;height:170px;padding-top:10px">${
    months.map(m=>{ const h=Math.round(byMonth[m]/max*140)+4; const [yy,mm]=m.split('-'); return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end">
      <small style="font-size:11px;color:var(--navy);font-weight:700">${money(byMonth[m])}</small>
      <div style="width:100%;max-width:54px;height:${h}px;background:linear-gradient(180deg,var(--blue),var(--navy));border-radius:7px 7px 0 0"></div>
      <small style="font-size:11px;color:var(--muted)">${MESES[+mm-1].slice(0,3)} ${yy.slice(2)}</small></div>`; }).join('')||'<div class="empty" style="width:100%">Sin datos</div>'
  }</div></div>`);
  c.appendChild(chart);

  const card=el(`<div class="card"><div class="section-head" style="padding:18px 20px 0"><h3>Detalle por evento</h3></div><div class="t-wrap"><table><thead><tr><th>Cliente</th><th>Fecha</th><th>Estatus</th><th style="text-align:right">Total</th><th style="text-align:right">Cobrado</th><th style="text-align:right">Saldo</th></tr></thead><tbody></tbody></table></div></div>`);
  const tb=$('tbody',card);
  activos.sort((a,b)=>b.fecha.localeCompare(a.fecha)).forEach(e=>{
    const tr=el(`<tr style="cursor:pointer"><td><b>${esc(e.cliente)}</b></td><td>${fmtFecha(e.fecha)}</td><td>${badge(e.estatus)}</td><td style="text-align:right">${money(e.total)}</td><td style="text-align:right;color:var(--ok)">${money(cobrado(e))}</td><td style="text-align:right;color:${saldo(e)>0?'var(--warn)':'var(--muted)'};font-weight:600">${saldo(e)>0?money(saldo(e)):'—'}</td></tr>`);
    tr.onclick=()=>openEventoModal(e); tb.appendChild(tr);
  });
  c.appendChild(card);
}

  const aceptadas=rows.filter(x=>x.ef==='aceptada');
  const cerradas=rows.filter(x=>['aceptada','rechazada','vencida'].includes(x.ef));
  const tasa=cerradas.length?Math.round(aceptadas.length/cerradas.length*100):0;
  const ganado=aceptadas.reduce((s,x)=>s+x.t,0);
  const pipeline=rows.filter(x=>x.ef==='enviada').reduce((s,x)=>s+x.t,0);
  const ticket=aceptadas.length?ganado/aceptadas.length:0;

  c.appendChild(el(`<div class="kpi-grid">
    ${kpi('doc','i-blue',cots.length,'Cotizaciones')}
    ${kpi('dash','i-ok',tasa+'%','Tasa de cierre')}
    ${kpi('money','i-ok',money(ganado),'Ganado (aceptadas)')}
    ${kpi('pipe','i-warn',money(pipeline),'En pipeline (abiertas)')}
    ${kpi('money','i-navy',money(ticket),'Ticket promedio')}
  </div>`));

  const bar=el(`<div class="toolbar">
    <div class="search">${svg('search',16)}<input id="coSearch" placeholder="Buscar folio o cliente..."></div>
    <select class="filter" id="coEst">
      <option value="">Todos los estatus</option>
      <option value="borrador">Borrador</option><option value="enviada">Enviada</option>
      <option value="aceptada">Aceptada</option><option value="rechazada">Rechazada</option><option value="vencida">Vencida</option>
    </select>
    <button class="btn btn-accent" id="coNew">${svg('plus',16)} Nueva cotización</button>
  </div>`);

  const card=el(`<div class="card"><div class="t-wrap"><table><thead><tr><th>Folio</th><th>Cliente</th><th>Fecha</th><th style="text-align:right">Total</th><th style="text-align:center">Estatus</th><th></th></tr></thead><tbody id="coBody"></tbody></table></div></div>`);
  c.appendChild(card);
  const draw=()=>{
    const q=($('#coSearch',bar).value||'').toLowerCase(), ef=$('#coEst',bar).value;
    const tb=$('#coBody',card); tb.innerHTML='';
    const list=cots
      .filter(x=>!ef || cotEstatusEf(x)===ef)
      .filter(x=>!q || (('#'+x.folio+' '+(x.cliente||'')).toLowerCase().includes(q)))
      .sort((a,b)=>(b.folio||0)-(a.folio||0));
    if(!list.length){ tb.appendChild(el(`<tr><td colspan="6">${emptyState('Sin cotizaciones','Crea tu primera cotización.').outerHTML}</td></tr>`)); return; }
    list.forEach(x=>{
      const s=COT_STATUS[cotEstatusEf(x)]||{label:x.estatus,cls:'b-pendiente'};
      const tr=el(`<tr style="cursor:pointer">
        <td><b>#${x.folio??'—'}</b></td>
        <td>${esc(x.cliente||'—')}</td>
        <td>${fmtFecha(x.fecha)}</td>

      </tr>`);
      tr.onclick=(e)=>{ if(e.target.closest('.ed')) return; openCotizacionDoc(x); };
      $('.vr',tr).onclick=(e)=>{ e.stopPropagation(); openCotizacionDoc(x); };
      $('.ed',tr).onclick=(e)=>{ e.stopPropagation(); openCotizacionModal(x); };
      tb.appendChild(tr);
    });
  };
  $('#coSearch',bar).oninput=draw; $('#coEst',bar).onchange=draw; draw();
}

/* ---------- Modal: crear/editar cotización ---------- */
function openCotizacionModal(cot){
  const isNew=!cot;
  const c0 = cot ? JSON.parse(JSON.stringify(cot)) : {cliente:'',cliente_id:null,telefono:'',email:'',fecha:todayISO(),vigencia_dias:15,estatus:'borrador',descuento:0,envio:0,iva:false,notas:'',items:[],evento_id:null};
  if(!c0.items) c0.items=[];
  const modal=el(`<div class="overlay"><div class="modal modal-lg">
    <div class="modal-head"><h3>${isNew?'Nueva cotización':'Cotización #'+(c0.folio||'')}</h3><button class="x">${svg('x',18)}</button></div>
    <div class="modal-body">
      <div class="form-field"><label>Cliente registrado (opcional)</label><select id="c_sel"><option value="">— Escribir manualmente —</option>${state.data.clientes.slice().sort((a,b)=>(a.numero_cliente||0)-(b.numero_cliente||0)).map(cl=>`<option value="${cl.id}" ${c0.cliente_id===cl.id?'selected':''}>#${cl.numero_cliente} · ${esc(cl.nombre)}</option>`).join('')}</select></div>
      <div class="grid2">
        <div class="form-field"><label>Cliente *</label><input id="c_nom" value="${esc(c0.cliente)}" placeholder="Nombre del cliente"></div>
        <div class="form-field"><label>Teléfono</label><input id="c_tel" value="${esc(c0.telefono||'')}" placeholder="81 ..."></div>
      </div>
      <div class="grid2">
        <div class="form-field"><label>Correo del cliente</label><input id="c_mail" value="${esc(c0.email||'')}" placeholder="cliente@correo.com"></div>
        <div class="form-field"><label>Vigencia (días)</label><input type="number" id="c_vig" min="1" value="${c0.vigencia_dias||15}"></div>
      </div>
      <div class="form-field"><label>Fecha</label><input type="date" id="c_fecha" value="${esc(c0.fecha||todayISO())}"></div>
      <div class="form-field"><label>Conceptos</label><div id="c_items"></div>
        <button class="btn btn-ghost btn-sm" id="c_add" style="margin-top:4px">${svg('plus',15)} Agregar concepto</button>
      </div>
      <div class="grid2">
        <div class="form-field"><label>Descuento (MXN)</label><input type="number" id="c_desc" min="0" value="${c0.descuento||0}"></div>
        <div class="form-field"><label>Envío (MXN)</label><input type="number" id="c_env" min="0" value="${c0.envio||0}"></div>
      </div>
      <label class="chk"><input type="checkbox" id="c_iva" ${c0.iva?'checked':''}> Agregar IVA 16% (cuando el cliente requiere factura)</label>
      <div class="cot-tot" id="c_tot"></div>
      <div class="form-field"><label>Notas / condiciones</label><textarea id="c_notas" rows="2" placeholder="Ej. Precios sujetos a disponibilidad. Anticipo del 50% para apartar.">${esc(c0.notas||'')}</textarea></div>
    </div>
    <div class="modal-foot">
      <div>${!isNew?'<button class="btn btn-ghost btn-sm" id="c_del" style="color:var(--danger)">Eliminar</button>':''}</div>
      <div style="display:flex;gap:10px"><button class="btn btn-ghost" id="c_cancel">Cancelar</button><button class="btn btn-primary" id="c_save">${isNew?'Crear cotización':'Guardar'}</button></div>
    </div>
  </div></div>`);
  $('#modalRoot').appendChild(modal);
  const close=()=>modal.remove();
  $('.x',modal).onclick=close; $('#c_cancel',modal).onclick=close;
  modal.onclick=(e)=>{ if(e.target===modal)close(); };

  const clSel=$('#c_sel',modal);
  clSel.onchange=()=>{ const cl=clienteById(clSel.value); if(cl){ c0.cliente_id=cl.id; $('#c_nom',modal).value=cl.nombre; $('#c_tel',modal).value=cl.telefono||''; $('#c_mail',modal).value=cl.email||''; } else { c0.cliente_id=null; } };

  const prodOpts=(sel)=>{ const opt=m=>`<option value="${m.id}" ${sel===m.id?'selected':''}>${esc(m.nombre)}${m.precio_renta>0?' ('+money(m.precio_renta)+')':''}</option>`; const prods=state.data.mobiliario.filter(m=>m.tipo==='producto'); const piez=state.data.mobiliario.filter(m=>(m.tipo||'pieza')==='pieza'); return '<option value="">Selecciona concepto...</option>'+(prods.length?'<optgroup label="Productos de renta">'+prods.map(opt).join('')+'</optgroup>':'')+(piez.length?'<optgroup label="Existencias físicas">'+piez.map(opt).join('')+'</optgroup>':''); };
  const drawItems=()=>{
    const box=$('#c_items',modal); box.innerHTML='';
    if(!c0.items.length) box.appendChild(el(`<div class="hint" style="margin:2px 0 6px">Agrega al menos un concepto.</div>`));
    c0.items.forEach((it,idx)=>{
      const imp=(Number(it.precio)||0)*(Number(it.cantidad)||0);
      const row=el(`<div class="cot-item">
        <select class="ci-mob">${prodOpts(it.mob_id)}</select>
        <input type="number" class="ci-qty" min="1" value="${it.cantidad||1}" title="Cantidad">
        <input type="number" class="ci-pre" min="0" value="${it.precio||0}" title="Precio unitario">
        <div class="ci-imp">${money(imp)}</div>
        <button class="rm" title="Quitar">${svg('x',15)}</button>
      </div>`);
      $('.ci-mob',row).onchange=(x)=>{ const m=mobById(x.target.value); it.mob_id=x.target.value; if(m){ it.descripcion=m.nombre; if(Number(m.precio_renta)>0) it.precio=Number(m.precio_renta); } recalc(); drawItems(); };
      $('.ci-qty',row).oninput=(x)=>{ it.cantidad=Math.max(1,+x.target.value||1); recalc(); };
      $('.ci-qty',row).onchange=drawItems;
      $('.ci-pre',row).oninput=(x)=>{ it.precio=Math.max(0,+x.target.value||0); recalc(); };
      $('.ci-pre',row).onchange=drawItems;
      $('.rm',row).onclick=()=>{ c0.items.splice(idx,1); recalc(); drawItems(); };
      box.appendChild(row);
    });
  };
  const readFiscales=()=>{ c0.descuento=+$('#c_desc',modal).value||0; c0.envio=+$('#c_env',modal).value||0; c0.iva=$('#c_iva',modal).checked; };
  const recalc=()=>{
    readFiscales();
    const t=cotTotals(c0);
    $('#c_tot',modal).innerHTML=`
      <div class="row"><span>Subtotal</span><b>${money(t.subtotal)}</b></div>
      ${t.desc>0?`<div class="row"><span>Descuento</span><b style="color:var(--danger)">- ${money(t.desc)}</b></div>`:''}
      ${t.envio>0?`<div class="row"><span>Envío</span><b>${money(t.envio)}</b></div>`:''}
      ${c0.iva?`<div class="row"><span>IVA 16%</span><b>${money(t.iva)}</b></div>`:''}
      <div class="row total"><span>Total</span><b>${money(t.total)}</b></div>`;
  };
  $('#c_add',modal).onclick=()=>{ c0.items.push({mob_id:'',descripcion:'',cantidad:1,precio:0}); drawItems(); };
  ['#c_desc','#c_env'].forEach(s=>$(s,modal).oninput=recalc);
  $('#c_iva',modal).onchange=recalc;
  drawItems(); recalc();

  if(!isNew)$('#c_del',modal).onclick=async()=>{ if(confirm('¿Eliminar esta cotización?')){ await Store.deleteCotizacion(c0.id); toast('Cotización eliminada','ok'); close(); render(); } };
  $('#c_save',modal).onclick=async()=>{
    const nom=$('#c_nom',modal).value.trim();
    if(!nom){ toast('Escribe el nombre del cliente','err'); return; }
    if(!c0.items.length){ toast('Agrega al menos un concepto','err'); return; }
    readFiscales();
    Object.assign(c0,{cliente:nom,telefono:$('#c_tel',modal).value.trim(),email:$('#c_mail',modal).value.trim(),vigencia_dias:+$('#c_vig',modal).value||15,fecha:$('#c_fecha',modal).value||todayISO(),notas:$('#c_notas',modal).value.trim()});
    await Store.saveCotizacion(c0); toast(isNew?'Cotización creada':'Guardada','ok'); close(); render();
  };
}

/* ---------- Documento de cotización (ver / enviar / imprimir) ---------- */
const LOGO_URL='https://www.eventosarias.com/wp-content/uploads/2024/06/logonuevo.jpg';
function cotResumenTexto(cot){
  const t=cotTotals(cot);
  const lineas=(cot.items||[]).map(it=>`• ${it.cantidad} x ${it.descripcion||'Concepto'} — ${money((Number(it.precio)||0)*(Number(it.cantidad)||0))}`);
  let s=`Cotización #${cot.folio||''} — Eventos Arias\n\nEstimado(a) ${cot.cliente||''}:\nGracias por su interés. A continuación su cotización:\n\n`;
  s+=lineas.join('\n')+'\n\n';
  s+=`Subtotal: ${money(t.subtotal)}\n`;
  if(t.desc>0) s+=`Descuento: - ${money(t.desc)}\n`;
  if(t.envio>0) s+=`Envío: ${money(t.envio)}\n`;
  if(cot.iva) s+=`IVA 16%: ${money(t.iva)}\n`;
  s+=`TOTAL: ${money(t.total)}\n\n`;
  const v=cotVence(cot); s+=`Vigencia: ${cot.vigencia_dias||15} días${v?` (hasta el ${fmtFecha(v.toISOString().slice(0,10))})`:''}.\n`;
  if(cot.notas) s+=`\n${cot.notas}\n`;
  s+=`\nQuedamos atentos.\nEventos Arias · Todo para tu evento\nwww.eventosarias.com · WhatsApp 81 2346 3852`;
  return s;
}

function cotImprimir(cot){
  const w=window.open('','_blank'); if(!w){ toast('Permite las ventanas emergentes para imprimir','err'); return; }
  w.document.write(cotDocHTML(cot)); w.document.close();
  setTimeout(()=>{ try{ w.focus(); w.print(); }catch(e){} }, 500);
}
async function cotMarcarEnviada(cot){
  if(cot.estatus==='borrador'){ await Store.patchCotizacion(cot.id,{estatus:'enviada',enviada_en:new Date().toISOString()}); cot.estatus='enviada'; }
}
function cotEnviarCorreo(cot){
  const su=encodeURIComponent(`Cotización Eventos Arias — Folio #${cot.folio||''}`);
  const body=encodeURIComponent(cotResumenTexto(cot));
  const to=encodeURIComponent(cot.email||'');
  const url=`https://mail.google.com/mail/?view=cm&fs=1&tf=1&to=${to}&su=${su}&body=${body}&authuser=info@eventosarias.com`;
  window.open(url,'_blank');
  cotMarcarEnviada(cot).then(()=>render());
}
function cotEnviarWhatsapp(cot){
  let tel=(cot.telefono||'').replace(/\D/g,''); if(tel && tel.length===10) tel='52'+tel;
  const url=`https://wa.me/${tel}?text=${encodeURIComponent(cotResumenTexto(cot))}`;
  window.open(url,'_blank');
  cotMarcarEnviada(cot).then(()=>render());
}
async function cotConvertirEvento(cot){
  if(cot.evento_id){ toast('Esta cotización ya se convirtió en evento','ok'); return; }
  if(!confirm('¿Convertir esta cotización en un evento confirmado?')) return;
  const t=cotTotals(cot);
  const items=(cot.items||[]).filter(it=>it.mob_id).map(it=>({mob_id:it.mob_id,cantidad:Number(it.cantidad)||1}));
  const ev={cliente:cot.cliente,cliente_id:cot.cliente_id||null,telefono:cot.telefono||'',fecha:cot.fecha||todayISO(),hora:'',direccion:'',tipo:'Renta',estatus:'confirmado',total:t.total,anticipo:0,chofer_id:null,notas:`Generado de la cotización #${cot.folio||''}.`,entregado:false,recogido:false,items};
  const evId=await Store.saveEvento(ev);
  await Store.patchCotizacion(cot.id,{estatus:'aceptada',evento_id:evId||null,decidida_en:new Date().toISOString()});
  toast('Cotización aceptada y evento creado','ok');
}
function openCotizacionDoc(cot){
  const ef=cotEstatusEf(cot); const s=COT_STATUS[ef]||{label:cot.estatus,cls:'b-pendiente'};
  const modal=el(`<div class="overlay"><div class="modal modal-lg">
    <div class="modal-head"><h3>Cotización #${cot.folio||''} <span class="badge ${s.cls}" style="margin-left:8px">${s.label}</span></h3><button class="x">${svg('x',18)}</button></div>

        <button class="btn btn-ghost btn-sm" id="d_wa">WhatsApp</button>
        <button class="btn btn-ghost btn-sm" id="d_print">Imprimir / PDF</button>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        ${ef!=='aceptada'?`<button class="btn btn-ghost btn-sm" id="d_acc" style="color:var(--pay)">Marcar aceptada</button>`:''}
        ${(ef==='enviada'||ef==='vencida')?`<button class="btn btn-ghost btn-sm" id="d_rej" style="color:var(--danger)">Rechazada</button>`:''}
        ${!cot.evento_id?`<button class="btn btn-primary btn-sm" id="d_conv">Convertir en evento</button>`:`<span class="hint" style="align-self:center">✓ Evento creado</span>`}
      </div>
    </div>
  </div></div>`);
  $('#modalRoot').appendChild(modal);
  const close=()=>modal.remove();

  const fr=$('#cotFrame',modal); fr.srcdoc=cotDocHTML(cot);

  $('#d_print',modal).onclick=()=>cotImprimir(cot);

  if($('#d_rej',modal))$('#d_rej',modal).onclick=async()=>{ await Store.patchCotizacion(cot.id,{estatus:'rechazada',decidida_en:new Date().toISOString()}); toast('Marcada como rechazada','ok'); close(); render(); };

/* ---------- AGENDA (vista chofer) ---------- */
function renderAgenda(c){
  const chofer = state.data.choferes.find(ch=>ch.nombre===state.user.name) || state.data.choferes[0];
  const hoy=todayISO();
  const mios=state.data.eventos.filter(e=>e.chofer_id===(chofer?chofer.id:null)&&e.estatus!=='cancelado'&&e.fecha>=hoy).sort((a,b)=>a.fecha.localeCompare(b.fecha));
  c.appendChild(el(`<p style="color:var(--muted);margin-bottom:16px">Agenda de <b style="color:var(--navy)">${esc(chofer?chofer.nombre:'—')}</b></p>`));

  // ---- Eventos ----
  c.appendChild(el(`<h3 style="color:var(--navy);font-size:15px;margin:4px 0 10px">${svg('truck',17)} Eventos</h3>`));
  if(!mios.length){ c.appendChild(el(`<p class="muted" style="font-size:13px;margin-bottom:14px">Sin eventos próximos asignados.</p>`)); }
  const groups={}; mios.forEach(e=>{(groups[e.fecha]=groups[e.fecha]||[]).push(e);});
  Object.keys(groups).sort().forEach(f=>{
    const day=el(`<div class="driver-day"><div class="dh">${svg('cal',16)} ${fmtFechaLarga(f)}</div></div>`);
    groups[f].forEach(e=>{
      const job=el(`<div class="job">
        <div class="jt"><b>${esc(e.cliente)}</b><span class="badge b-${e.estatus}">${STATUS[e.estatus].label}</span></div>
        <div class="addr">${svg('clock',15)} ${esc(e.hora||'Hora por confirmar')}</div>
        <div class="addr">${svg('pin',15)} ${esc(e.direccion||'Dirección por confirmar')}</div>
        <div class="load"><b>Mobiliario a cargar</b><ul>${(e.items||[]).map(it=>{const m=mobById(it.mob_id);return `<li><span>${esc(m?m.nombre:'—')}</span><span>${it.cantidad}</span></li>`;}).join('')||'<li>—</li>'}</ul></div>
        ${e.notas?`<div style="margin-top:8px;font-size:12.5px;color:var(--muted)">📋 ${esc(e.notas)}</div>`:''}
        <div class="job-actions">
          <button class="btn btn-sm ${e.entregado?'check-done':'check-todo'}" data-a="entregado">${e.entregado?'✓ Entregado':'Marcar entregado'}</button>
          <button class="btn btn-sm ${e.recogido?'check-done':'check-todo'}" data-a="recogido">${e.recogido?'✓ Recogido':'Marcar recogido'}</button>
        </div>
      </div>`);
      $$('[data-a]',job).forEach(b=>b.onclick=async()=>{ const key=b.dataset.a; await Store.patchEvento(e.id,{[key]:!e[key]}); e[key]=!e[key]; toast(e[key]?'Marcado como '+key:'Desmarcado','ok'); render(); });
      day.appendChild(job);
    });
    c.appendChild(day);
  });

  // ---- Encargos ----
  const misEnc = state.data.encargos
    .filter(en=>en.chofer_id===(chofer?chofer.id:null))
    .sort((a,b)=>((a.estatus==='hecho')-(b.estatus==='hecho'))||String(a.fecha||'').localeCompare(String(b.fecha||'')));
  const pendEnc = misEnc.filter(en=>en.estatus!=='hecho').length;
  c.appendChild(el(`<h3 style="color:var(--navy);font-size:15px;margin:22px 0 10px">${svg('clip',17)} Encargos${pendEnc?` <span class="pill" style="background:var(--accent);color:#fff">${pendEnc}</span>`:''}</h3>`));
  if(!misEnc.length){ c.appendChild(el(`<p class="muted" style="font-size:13px">Sin encargos asignados. Cuando la administradora te asigne uno aparecerá aquí.</p>`)); return; }
  misEnc.forEach(en=>{
    const hecho=en.estatus==='hecho', urg=en.prioridad==='urgente';
    const job=el(`<div class="job" style="${hecho?'opacity:.6':''}">
      <div class="jt"><b>${esc(en.titulo)}</b>${urg&&!hecho?'<span class="badge b-cancelado">Urgente</span>':''}</div>
      ${en.fecha?`<div class="addr">${svg('cal',15)} ${fmtFechaLarga(en.fecha)}</div>`:''}
      ${en.notas?`<div style="margin-top:6px;font-size:12.5px;color:var(--muted)">📋 ${esc(en.notas)}</div>`:''}
      <div class="job-actions">
        <button class="btn btn-sm ${hecho?'check-done':'check-todo'}" data-mk>${hecho?'✓ Hecho':'Marcar hecho'}</button>
      </div>
    </div>`);
    $('[data-mk]',job).onclick=async()=>{ const ns=hecho?'pendiente':'hecho'; await Store.patchEncargo(en.id,{estatus:ns}); en.estatus=ns; toast(ns==='hecho'?'Encargo hecho':'Reabierto','ok'); render(); };
    c.appendChild(job);
  });
}

/* =========================================================================
   MODAL DE EVENTO
   ========================================================================= */
function openEventoModal(ev){
  const isNew=!ev;
  const e = ev ? JSON.parse(JSON.stringify(ev)) : {cliente:'',cliente_id:null,telefono:'',fecha:todayISO(),hora:'',direccion:'',tipo:'Boda',estatus:'pendiente',total:0,anticipo:0,chofer_id:null,notas:'',items:[],entregado:false,recogido:false};
  const modal=el(`<div class="overlay"><div class="modal wide">
    <div class="modal-head"><h3>${isNew?'Nuevo evento':'Editar evento'}</h3><button class="x">${svg('x',18)}</button></div>
    <div class="modal-body">
      <div class="form-field"><label>Cliente registrado (opcional)</label><select id="f_clienteSel"><option value="">— Escribir manualmente —</option>${state.data.clientes.slice().sort((a,b)=>(a.numero_cliente||0)-(b.numero_cliente||0)).map(cl=>`<option value="${cl.id}" ${e.cliente_id===cl.id?'selected':''}>#${cl.numero_cliente} · ${esc(cl.nombre)}</option>`).join('')}</select><div class="hint">Elige un cliente de tu base o escribe el nombre abajo.</div></div>
      <div class="grid2">
        <div class="form-field"><label>Cliente / Nombre del evento *</label><input id="f_cli" value="${esc(e.cliente)}" placeholder="Ej. Boda García"></div>
        <div class="form-field"><label>Teléfono</label><input id="f_tel" value="${esc(e.telefono)}" placeholder="81 0000 0000"></div>
      </div>
      <div class="grid3">
        <div class="form-field"><label>Fecha *</label><input type="date" id="f_fecha" value="${esc(e.fecha)}"></div>
        <div class="form-field"><label>Hora</label><input type="time" id="f_hora" value="${esc(e.hora)}"></div>
        <div class="form-field"><label>Tipo</label><select id="f_tipo">${['Boda','XV Años','Cumpleaños','Corporativo','Bautizo','Graduación','Otro'].map(t=>`<option ${e.tipo===t?'selected':''}>${t}</option>`).join('')}</select></div>
      </div>
      <div class="form-field"><label>Dirección del evento</label><input id="f_dir" value="${esc(e.direccion)}" placeholder="Salón / Jardín, calle, colonia, ciudad"></div>
      <div class="grid2">
        <div class="form-field"><label>Estatus</label><select id="f_est">${Object.keys(STATUS).map(k=>`<option value="${k}" ${e.estatus===k?'selected':''}>${STATUS[k].full}</option>`).join('')}</select></div>
        <div class="form-field"><label>Chofer asignado</label><select id="f_chofer"><option value="">Sin asignar</option>${state.data.choferes.map(ch=>`<option value="${ch.id}" ${e.chofer_id===ch.id?'selected':''}>${esc(ch.nombre)}</option>`).join('')}</select></div>
      </div>

      <div class="form-field"><label>Mobiliario del evento</label><div id="itemsWrap"></div>
        <button class="btn btn-ghost btn-sm" id="addItem" style="margin-top:4px">${svg('plus',15)} Agregar mobiliario</button>
      </div>

      <div class="grid2">
        <div class="form-field"><label>Total del evento (MXN)</label><input type="number" id="f_total" value="${e.total||0}" min="0"><div class="hint" id="sugTotal"></div></div>
        <div class="form-field"><label>Anticipo pagado (MXN)</label><input type="number" id="f_ant" value="${e.anticipo||0}" min="0"></div>
      </div>
      <div class="summary" id="sumBox"></div>
      <div class="form-field" style="margin-top:14px"><label>Notas / instrucciones para logística</label><textarea id="f_notas" placeholder="Ej. Montaje 3 hrs antes, acceso por portón trasero...">${esc(e.notas)}</textarea></div>
    </div>
    <div class="modal-foot">
      <div>${!isNew?'<button class="btn btn-ghost btn-sm" id="delEv" style="color:var(--danger)">Eliminar</button>':''}</div>
      <div style="display:flex;gap:10px"><button class="btn btn-ghost" id="cancelEv">Cancelar</button><button class="btn btn-primary" id="saveEv">${isNew?'Crear evento':'Guardar cambios'}</button></div>
    </div>
  </div></div>`);
  $('#modalRoot').appendChild(modal);
  const close=()=>modal.remove();
  $('.x',modal).onclick=close; $('#cancelEv',modal).onclick=close;
  modal.onclick=(ev2)=>{ if(ev2.target===modal)close(); };

  const clSel=$('#f_clienteSel',modal);
  if(clSel) clSel.onchange=()=>{
    e.cliente_id = clSel.value||null;
    const cl = clSel.value?clienteById(clSel.value):null;
    if(cl){ $('#f_cli',modal).value=cl.nombre; if(cl.telefono) $('#f_tel',modal).value=cl.telefono; }
  };

  const itemsWrap=$('#itemsWrap',modal);
  const drawItems=()=>{
    itemsWrap.innerHTML='';
    e.items.forEach((it,idx)=>{
      const fecha=$('#f_fecha',modal).value;
      const disp=it.mob_id?disponibleEn(it.mob_id,fecha,e.id):null;
      const row=el(`<div class="item-row">
        <select class="it-mob">${(()=>{const opt=m=>`<option value="${m.id}" ${it.mob_id===m.id?'selected':''}>${esc(m.nombre)}${m.precio_renta>0?' ('+money(m.precio_renta)+')':''}</option>`;const prods=state.data.mobiliario.filter(m=>m.tipo==='producto');const piez=state.data.mobiliario.filter(m=>(m.tipo||'pieza')==='pieza');return '<option value="">Selecciona...</option>'+(prods.length?'<optgroup label="Productos de renta">'+prods.map(opt).join('')+'</optgroup>':'')+(piez.length?'<optgroup label="Existencias físicas">'+piez.map(opt).join('')+'</optgroup>':'');})()}</select>
        <input type="number" class="it-qty" min="1" value="${it.cantidad||1}">
        <button class="rm">${svg('x',15)}</button>
      </div>`);
      if(it.mob_id&&disp!=null){ const over=it.cantidad>disp; row.appendChild(el(`<div style="grid-column:1/-1;font-size:11.5px;margin-top:-4px;color:${over?'var(--danger)':'var(--muted)'}">${over?'⚠ ':''}Disponibles el ${fmtFecha(fecha)}: ${disp} de ${mobById(it.mob_id).cantidad_total}</div>`)); }
      $('.it-mob',row).onchange=(x)=>{ it.mob_id=x.target.value; recalc(); drawItems(); };
      $('.it-qty',row).oninput=(x)=>{ it.cantidad=Math.max(1,+x.target.value||1); recalc(); };
      $('.it-qty',row).onchange=()=>drawItems();
      $('.rm',row).onclick=()=>{ e.items.splice(idx,1); recalc(); drawItems(); };
      itemsWrap.appendChild(row);
    });
  };
  const recalc=()=>{
    const sug=eventoTotalCalc(e.items);
    $('#sugTotal',modal).textContent = sug>0?`Sugerido según mobiliario: ${money(sug)}`:'';
    const total=+$('#f_total',modal).value||0, ant=+$('#f_ant',modal).value||0;
    const sal=Math.max(0,total-ant);
    $('#sumBox',modal).innerHTML=`<div class="r"><span>Total del evento</span><b>${money(total)}</b></div><div class="r"><span>Anticipo</span><span style="color:var(--ok)">${money(ant)}</span></div><div class="r tot"><span>Saldo pendiente</span><span class="saldo">${money(sal)}</span></div>`;
  };
  $('#addItem',modal).onclick=()=>{ e.items.push({mob_id:'',cantidad:1}); drawItems(); };
  $('#f_total',modal).oninput=recalc; $('#f_ant',modal).oninput=recalc;
  $('#f_fecha',modal).onchange=drawItems;
  drawItems(); recalc();

  // botón "usar sugerido"
  $('#sugTotal',modal).style.cursor='pointer';
  $('#sugTotal',modal).onclick=()=>{ const sug=eventoTotalCalc(e.items); if(sug>0){ $('#f_total',modal).value=sug; recalc(); } };

  if(!isNew)$('#delEv',modal).onclick=async()=>{ if(confirm('¿Eliminar este evento? Esta acción no se puede deshacer.')){ await Store.deleteEvento(e.id); toast('Evento eliminado','ok'); close(); render(); } };

  $('#saveEv',modal).onclick=async()=>{
    const cli=$('#f_cli',modal).value.trim();
    if(!cli){ toast('Escribe el nombre del cliente/evento','err'); $('#f_cli',modal).focus(); return; }
    Object.assign(e,{
      cliente:cli, telefono:$('#f_tel',modal).value.trim(), fecha:$('#f_fecha',modal).value,
      hora:$('#f_hora',modal).value, tipo:$('#f_tipo',modal).value, direccion:$('#f_dir',modal).value.trim(),
      estatus:$('#f_est',modal).value, chofer_id:$('#f_chofer',modal).value||null,
      total:+$('#f_total',modal).value||0, anticipo:+$('#f_ant',modal).value||0, notas:$('#f_notas',modal).value.trim(),
      items:e.items.filter(it=>it.mob_id)
    });
    await Store.saveEvento(e);
    toast(isNew?'Evento creado':'Cambios guardados','ok'); close(); render();
  };
}

/* =========================================================================
   MODAL DE MOBILIARIO
   ========================================================================= */
function openMobModal(mob){
  const isNew=!mob||!mob.id;
  const m = (mob&&mob.id)?{...mob}:{nombre:'',categoria:'',cantidad_total:1,precio_renta:0,tipo:(mob&&mob.tipo)||'pieza',unidad:(mob&&mob.tipo==='producto')?'set':'pieza'};
  const cats=[...new Set(state.data.mobiliario.map(x=>x.categoria).filter(Boolean))].sort();
  const modal=el(`<div class="overlay"><div class="modal">
    <div class="modal-head"><h3>${isNew?'Nuevo artículo':'Editar artículo'}</h3><button class="x">${svg('x',18)}</button></div>
    <div class="modal-body">
      <div class="form-field"><label>Tipo</label><select id="m_tipo">
        <option value="pieza" ${(m.tipo||'pieza')==='pieza'?'selected':''}>Existencia física (pieza)</option>
        <option value="producto" ${m.tipo==='producto'?'selected':''}>Producto de renta (con precio)</option>
      </select></div>
      <div class="form-field"><label>Nombre del artículo *</label><input id="m_nom" value="${esc(m.nombre)}" placeholder="Ej. Mesa periquera dorada"></div>
      <div class="form-field"><label>Categoría</label><input id="m_cat" list="catlist" value="${esc(m.categoria)}" placeholder="Ej. Periqueras"><datalist id="catlist">${cats.map(c=>`<option>${esc(c)}</option>`).join('')}</datalist></div>
      <div class="grid2">
        <div class="form-field"><label>Cantidad</label><input type="number" id="m_qty" min="0" value="${m.cantidad_total}"></div>
        <div class="form-field"><label>Unidad</label><input id="m_uni" value="${esc(m.unidad||'pieza')}" placeholder="pieza / set / paquete"></div>
      </div>
      <div class="form-field"><label>Precio de renta (MXN) — 0 si es artículo de apoyo</label><input type="number" id="m_precio" min="0" value="${m.precio_renta}"></div>
    </div>
    <div class="modal-foot">
      <div>${!isNew?'<button class="btn btn-ghost btn-sm" id="delMob" style="color:var(--danger)">Eliminar</button>':''}</div>
      <div style="display:flex;gap:10px"><button class="btn btn-ghost" id="cancelMob">Cancelar</button><button class="btn btn-primary" id="saveMob">${isNew?'Agregar':'Guardar'}</button></div>
    </div>
  </div></div>`);
  $('#modalRoot').appendChild(modal);
  const close=()=>modal.remove();
  $('.x',modal).onclick=close; $('#cancelMob',modal).onclick=close;
  modal.onclick=(e)=>{ if(e.target===modal)close(); };
  if(!isNew)$('#delMob',modal).onclick=async()=>{ if(confirm('¿Eliminar este artículo del inventario?')){ await Store.deleteMob(m.id); toast('Artículo eliminado','ok'); close(); render(); } };
  $('#saveMob',modal).onclick=async()=>{
    const nom=$('#m_nom',modal).value.trim();
    if(!nom){ toast('Escribe el nombre del artículo','err'); return; }
    Object.assign(m,{nombre:nom,categoria:$('#m_cat',modal).value.trim(),cantidad_total:+$('#m_qty',modal).value||0,precio_renta:+$('#m_precio',modal).value||0,tipo:$('#m_tipo',modal).value,unidad:$('#m_uni',modal).value.trim()||'pieza'});
    state.invTipo=m.tipo;
    await Store.saveMob(m); toast(isNew?'Artículo agregado':'Guardado','ok'); close(); render();
  };
}

/* =========================================================================
   AUTENTICACIÓN / ARRANQUE
   ========================================================================= */
async function startApp(user){
  state.user=user;
  $('#login').classList.add('hidden');
  $('#app').classList.remove('hidden');
  $('#demoBadge').classList.toggle('hidden',state.mode!=='demo');
  $('#userName').textContent=user.name;
  $('#userRole').textContent = user.role==='chofer'?'Chofer':'Administradora';
  $('#userAv').textContent=(user.name||'A')[0].toUpperCase();
  buildNav();
  await Store.loadAll();
  go(state.user.role==='chofer'?'agenda':'dashboard');
}

async function doLogin(){
  const email=$('#loginEmail').value.trim(), pass=$('#loginPass').value;
  const errEl=$('#loginErr'); errEl.textContent='';
  if(state.mode==='supabase'){
    const {data,error}=await state.sb.auth.signInWithPassword({email,password:pass});
    if(error){ errEl.textContent='Correo o contraseña incorrectos.'; return; }
    // rol desde metadata o tabla perfiles
    let role='admin',name=email.split('@')[0];
    try{ const {data:prof}=await state.sb.from('perfiles').select('*').eq('id',data.user.id).single(); if(prof){role=prof.rol||role;name=prof.nombre||name;} }catch(e){}
    startApp({name,role,email});
  } else {
    if(!email){ errEl.textContent='Escribe un correo para continuar.'; return; }
    startApp({name:'Administradora',role:'admin',email});
  }
}

function enterDemo(role='admin'){
  state.mode='demo';
  const name = role==='chofer' ? (seedDemo().choferes[0].nombre) : 'Administradora';
  startApp({name,role,email:'demo@eventosarias.com'});
}

/* ---------- Wire UI ---------- */
window.addEventListener('DOMContentLoaded', async ()=>{
  await Store.init();
  $('#loginBtn').onclick=doLogin;
  $('#loginPass').addEventListener('keydown',e=>{ if(e.key==='Enter')doLogin(); });
  $('#demoBtn').onclick=()=>enterDemo('admin');
  $('#logoutBtn').onclick=()=>{ if(state.mode==='supabase'&&state.sb)state.sb.auth.signOut(); location.reload(); };
  $('#menuBtn').onclick=()=>{ $('#sidebar').classList.add('open'); $('#backdrop').classList.add('show'); };
  $('#backdrop').onclick=()=>{ $('#sidebar').classList.remove('open'); $('#backdrop').classList.remove('show'); };

  // Evitar que el navegador deje pre-cargado correo/contraseña
  const clearLogin=()=>{ try{ if(state.user&&state.mode==='supabase'&&!$('#login').classList.contains('hidden')){} $('#loginEmail').value=''; $('#loginPass').value=''; }catch(e){} };
  clearLogin(); setTimeout(clearLogin,300); setTimeout(clearLogin,800);

  // Atajo demo: ?demo o ?demo=chofer entra directo
  const p=new URLSearchParams(location.search);
  if(p.has('demo')) enterDemo(p.get('demo')==='chofer'?'chofer':'admin');
});

</script>
